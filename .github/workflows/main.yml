name: Build G-Labs Studio

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements

      - name: Verify project
        shell: pwsh
        run: |
          $required = @(
            "desktop\main.py",
            "desktop\api_client.py",
            "desktop\workflow.py",
            "bridge\server.py",
            "requirements"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              Write-Error "Missing required file: $file"
              exit 1
            }

            Write-Host "OK: $file"
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements

          # requirements already contains PyInstaller,
          # but installing explicitly makes the build environment deterministic.
          python -m pip install "pyinstaller>=6.10,<7"

          python --version
          python -m pip --version
          python -m PyInstaller --version

      - name: Compile Python sources
        shell: pwsh
        run: |
          python -m compileall desktop bridge

      - name: Validate workflow JSON
        shell: pwsh
        run: |
          if (Test-Path "data\workflows") {
            $files = Get-ChildItem "data\workflows" -Filter "*.json" -Recurse

            foreach ($file in $files) {
              Write-Host "Checking workflow: $($file.FullName)"

              Get-Content $file.FullName -Raw |
                ConvertFrom-Json |
                Out-Null
            }
          }

      - name: Prepare build directories
        shell: pwsh
        run: |
          Remove-Item "package" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "build_pyinstaller" -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Path "package" | Out-Null
          New-Item -ItemType Directory -Path "build_pyinstaller" | Out-Null

      - name: Build Windows EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "G-Labs-Studio" `
            --distpath "$PWD\package" `
            --workpath "$PWD\build_pyinstaller" `
            --paths "$PWD\desktop" `
            --collect-all PySide6 `
            "$PWD\desktop\main.py"

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "package\G-Labs-Studio.exe"

          if (!(Test-Path $exe)) {
            Write-Error "G-Labs-Studio.exe was not created."
            exit 1
          }

          $size = (Get-Item $exe).Length

          Write-Host ""
          Write-Host "========================================"
          Write-Host "G-Labs Studio build successful"
          Write-Host "========================================"
          Write-Host "EXE : $exe"
          Write-Host "Size: $size bytes"
          Write-Host "========================================"
          Write-Host ""

          Get-ChildItem package -Recurse

      - name: Copy application resources
        shell: pwsh
        run: |
          $directories = @(
            "bridge",
            "extension",
            "assets",
            "data",
            "_locales"
          )

          foreach ($dir in $directories) {
            if (Test-Path $dir) {
              Write-Host "Copying $dir"

              Copy-Item `
                $dir `
                "package\$dir" `
                -Recurse `
                -Force
            }
          }

          $files = @(
            "README.md",
            "requirements"
          )

          foreach ($file in $files) {
            if (Test-Path $file) {
              Copy-Item `
                $file `
                "package\$file" `
                -Force
            }
          }

      - name: List final package
        shell: pwsh
        run: |
          Write-Host "Final package contents:"
          Get-ChildItem "package" -Recurse |
            Select-Object FullName, Length

      - name: Create ZIP package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "package\*" `
            -DestinationPath "G-Labs-Studio-Windows.zip" `
            -Force

          Write-Host "ZIP created:"
          Get-Item "G-Labs-Studio-Windows.zip" |
            Select-Object FullName, Length

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: G-Labs-Studio-Windows
          path: package
          if-no-files-found: error

      - name: Upload ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: G-Labs-Studio-Windows-ZIP
          path: G-Labs-Studio-Windows.zip
          if-no-files-found: error
